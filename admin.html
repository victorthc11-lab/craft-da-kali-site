<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Craft da Kali</title>
    <style>
        :root { --cor-primaria: #ffb7b2; --cor-fundo: #f4f7f6; --cor-texto: #333; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--cor-fundo); color: var(--cor-texto); padding: 2rem; }
        h1 { text-align: center; margin-bottom: 2rem; color: #444; }
        .container { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: 1fr 2fr; gap: 2rem; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }

        .card { background: white; padding: 1.5rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; font-size: 0.9rem; }
        input, select, textarea { width: 100%; padding: 0.8rem; border: 1px solid #ccc; border-radius: 5px; }

        button { background-color: var(--cor-primaria); color: #333; border: none; padding: 1rem; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; transition: background 0.2s; }
        button:hover { background-color: #ff9e99; }

        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; }

        .acoes-container { display: flex; gap: 5px; }
        .btn-acao { padding: 0.5rem 0.8rem; border-radius: 3px; border: none; cursor: pointer; font-weight: bold; color: white; }
        .btn-eliminar { background-color: #ff6b6b; }
        .btn-editar { background-color: #4facfe; }
        .btn-clonar { background-color: #ffd166; color: #333; }

        .imagem-miniatura { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; }

        .drop-zone { border: 2px dashed #ccc; border-radius: 5px; padding: 20px; text-align: center; cursor: pointer; color: #888; background-color: #fafafa; }
        .drop-zone:hover { border-color: var(--cor-primaria); background-color: #fff0f0; }

        /* Galeria de Previews */
        .preview-container { display: flex; gap: 10px; margin-top: 10px; overflow-x: auto; padding-bottom: 5px; }
        .preview-wrapper { position: relative; flex-shrink: 0; }
        .preview-img { width: 80px; height: 80px; object-fit: cover; border-radius: 5px; border: 1px solid #ddd; }
        .btn-remover-img { position: absolute; top: -5px; right: -5px; background: red; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 10px; cursor: pointer; padding: 0;}

        #btn-cancelar-edicao { background-color: #ccc; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <h1>⚙️ Painel de Administração - Craft da Kali</h1>

    <div class="container">
        <div class="card">
            <h2 id="titulo-form">Adicionar Produto</h2>
            <br>
            <form id="form-produto">
                <div class="form-group"><label>Nome</label><input type="text" id="nome" required></div>
                <div class="form-group"><label>Descrição</label><textarea id="descricao" rows="3" required></textarea></div>
                <div class="form-group"><label>Preço (R$)</label><input type="number" id="preco" step="0.01" required></div>
                <div class="form-group">
                    <label>Categoria</label>
                    <select id="categoria">
                        <option value="Hama Beads">Hama Beads</option>
                        <option value="Bottons">Bottons</option>
                        <option value="Pulseiras">Pulseiras</option>
                        <option value="Brincos">Brincos</option>
                        <option value="Chaveiros">Chaveiros</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Fotos (Pode adicionar várias)</label>
                    <div id="drop-zone" class="drop-zone">
                        <span id="drop-text">Arraste as fotos aqui ou clique</span>
                        <!-- O "multiple" permite selecionar várias fotos -->
                        <input type="file" id="file-input" accept="image/*" multiple style="display: none;">
                    </div>
                    <div id="preview-container" class="preview-container"></div>
                    <input type="hidden" id="imagem_url" required>
                </div>

                <button type="submit" id="btn-submit">Guardar Produto</button>
                <button type="button" id="btn-cancelar-edicao" onclick="cancelarEdicao()">Cancelar Ação</button>
            </form>
        </div>

        <div class="card">
            <h2>Estoque Atual</h2>
            <table>
                <thead><tr><th>Foto Principal</th><th>Nome</th><th>Preço</th><th>Ação</th></tr></thead>
                <tbody id="tabela-corpo"></tbody>
            </table>
        </div>
    </div>

    <script>
       const API_URL = '[https://craft-da-kali-api.onrender.com](https://craft-da-kali-api.onrender.com)';
        let produtosAtuais = [];
        let idEditando = null;
        let imagensCarregadas = []; // Agora é um Array de imagens!

        const formProduto = document.getElementById('form-produto');
        const tabelaCorpo = document.getElementById('tabela-corpo');
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const imagemUrlInput = document.getElementById('imagem_url');
        const previewContainer = document.getElementById('preview-container');
        const dropText = document.getElementById('drop-text');

        // --- UPLOAD MÚLTIPLO ---
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.backgroundColor = '#fff0f0'; });
        dropZone.addEventListener('dragleave', () => { dropZone.style.backgroundColor = '#fafafa'; });

        dropZone.addEventListener('drop', async (e) => {
            e.preventDefault();
            dropZone.style.backgroundColor = '#fafafa';
            for (let file of e.dataTransfer.files) { await uploadImagem(file); }
        });

        fileInput.addEventListener('change', async () => {
            for (let file of fileInput.files) { await uploadImagem(file); }
        });

        async function uploadImagem(file) {
            const formData = new FormData();
            formData.append("file", file);
            dropText.innerText = "A enviar foto...";

            try {
                const resposta = await fetch(`${API_URL}/upload-imagem/`, { method: 'POST', body: formData });
                const dados = await resposta.json();
                imagensCarregadas.push(dados.imagem_url);
                atualizarPreviews();
            } catch (erro) {
                alert("Erro ao enviar a imagem.");
            }
        }

        window.removerImagem = function(index) {
            imagensCarregadas.splice(index, 1);
            atualizarPreviews();
        }

        function atualizarPreviews() {
            previewContainer.innerHTML = '';
            imagensCarregadas.forEach((url, index) => {
                previewContainer.innerHTML += `
                    <div class="preview-wrapper">
                        <img src="${url}" class="preview-img">
                        <button type="button" class="btn-remover-img" onclick="removerImagem(${index})">X</button>
                    </div>
                `;
            });
            // Junta todas as URLs separadas por vírgula para guardar no banco de dados!
            imagemUrlInput.value = imagensCarregadas.join(',');
            dropText.innerText = imagensCarregadas.length > 0 ? "Adicionar mais fotos" : "Arraste as fotos aqui";
        }

        // --- CRUD ---
        async function carregarProdutos() {
            const resposta = await fetch(`${API_URL}/produtos`);
            produtosAtuais = await resposta.json();
            tabelaCorpo.innerHTML = '';

            produtosAtuais.forEach(produto => {
                // Para a tabela, mostramos só a primeira foto (antes da vírgula)
                const primeiraFoto = produto.imagem_url ? produto.imagem_url.split(',')[0] : '';
                tabelaCorpo.innerHTML += `
                    <tr>
                        <td><img src="${primeiraFoto}" class="imagem-miniatura" onerror="this.src='https://via.placeholder.com/50'"></td>
                        <td>${produto.nome}</td>
                        <td>R$ ${produto.preco.toFixed(2)}</td>
                        <td>
                            <div class="acoes-container">
                                <button class="btn-acao btn-editar" onclick="prepararEdicao(${produto.id})">✎</button>
                                <button class="btn-acao btn-clonar" onclick="clonarProduto(${produto.id})">📋</button>
                                <button class="btn-acao btn-eliminar" onclick="eliminarProduto(${produto.id})">✖</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
        }

        formProduto.addEventListener('submit', async function(e) {
            e.preventDefault();
            const produto = {
                nome: document.getElementById('nome').value,
                descricao: document.getElementById('descricao').value,
                preco: parseFloat(document.getElementById('preco').value),
                categoria: document.getElementById('categoria').value,
                imagem_url: imagemUrlInput.value,
                disponivel: true
            };
            const url = idEditando ? `${API_URL}/produtos/${idEditando}` : `${API_URL}/produtos`;
            const metodo = idEditando ? 'PUT' : 'POST';

            await fetch(url, { method: metodo, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(produto) });
            alert(idEditando ? 'Produto atualizado!' : 'Produto guardado!');
            cancelarEdicao();
            carregarProdutos();
        });

        window.prepararEdicao = function(id) {
            const p = produtosAtuais.find(x => x.id === id);
            if(p) preencherFormulario(p, "Editar Produto", "Atualizar Mimo");
        }

        window.clonarProduto = function(id) {
            const p = produtosAtuais.find(x => x.id === id);
            if(p) {
                idEditando = null; // Garante que cria um novo
                preencherFormulario(p, "Clonar Produto", "Guardar Novo Mimo", true);
            }
        }

        function preencherFormulario(produto, titulo, textoBotao, isClone = false) {
            if(!isClone) idEditando = produto.id;
            document.getElementById('titulo-form').innerText = titulo;
            document.getElementById('btn-submit').innerText = textoBotao;
            document.getElementById('btn-cancelar-edicao').style.display = "block";

            document.getElementById('nome').value = produto.nome + (isClone ? " (Cópia)" : "");
            document.getElementById('descricao').value = produto.descricao;
            document.getElementById('preco').value = produto.preco;
            document.getElementById('categoria').value = produto.categoria;

            // Separa as imagens pela vírgula e atualiza a galeria
            imagensCarregadas = produto.imagem_url ? produto.imagem_url.split(',') : [];
            atualizarPreviews();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.cancelarEdicao = function() {
            idEditando = null;
            formProduto.reset();
            document.getElementById('titulo-form').innerText = "Adicionar Produto";
            document.getElementById('btn-submit').innerText = "Guardar Produto";
            document.getElementById('btn-cancelar-edicao').style.display = "none";
            imagensCarregadas = [];
            atualizarPreviews();
        }

        window.eliminarProduto = async function(id) {
            if (confirm(`Queres mesmo eliminar?`)) {
                await fetch(`${API_URL}/produtos/${id}`, { method: 'DELETE' });
                carregarProdutos();
            }
        }

        carregarProdutos();
    </script>
</body>
</html>
